[tool.briefcase]
project_name = "Campus Connect"
bundle = "org.novara"
version = "1.0.0"
display_name = "Campus Connect"
description = "A professional social platform for university students."
license = { text = "Proprietary" }
author = "Novara University"
author_email = "tech@novara.ac.ug"

[tool.briefcase.app.campus_connect]
formal_name = "Campus Connect"
description = "A professional social platform for university students."
sources = ["src/campus_connect"]
requires = [
    "toga",
    "supabase",
    "python-dotenv",
    "httpx",
]

[tool.briefcase.app.campus_connect.macOS]
universal_build = true
requires = [
    "toga-cocoa",
]

[tool.briefcase.app.campus_connect.linux]
requires = [
    "toga-gtk",
]

[tool.briefcase.app.campus_connect.windows]
requires = [
    "toga-winforms",
]

[tool.briefcase.app.campus_connect.android]
requires = [
    "toga-android",
]

[tool.briefcase.app.campus_connect.iOS]
requires = [
    "toga-iOS",
]
